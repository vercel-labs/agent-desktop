name: Supply Chain

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the secret scan below can walk commits, not just
          # the final tree. A shallow clone would silently reduce it to a
          # working-tree scan.
          fetch-depth: 0

      - name: Check release metadata consistency
        run: scripts/check-release-consistency.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check npm package and publish policy
        run: node scripts/check-npm-package.js

      - name: Cargo dependency policy
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$RUNNER_TEMP/cargo-deny"
          "$RUNNER_TEMP/cargo-deny" --locked check advisories licenses bans sources

      - name: Secret and privacy scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          node scripts/check-gitleaks-policy.mjs ./gitleaks
          # Scan commit history, not just the checked-out tree: a value added
          # in one commit and removed in a later one stays reachable in branch
          # history, and a tree-only scan would pass it.
          ./gitleaks git . --log-opts=HEAD --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Workflow security audit
        run: pipx run --spec zizmor==1.25.2 zizmor --persona regular --min-severity medium --min-confidence high .github/workflows
