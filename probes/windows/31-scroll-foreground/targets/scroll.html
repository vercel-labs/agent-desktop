<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SFP Scroll Page</title>
<style>
body { margin: 8px; font: 14px sans-serif; }
h1 { font-size: 16px; margin: 0 0 8px; }
#tall { height: 300px; width: 400px; overflow-y: scroll; border: 1px solid #888; }
</style>
</head>
<body>
<h1>scroll foreground probe target</h1>
<p><button id="btn" type="button" onclick="this.dataset.count = (+this.dataset.count || 0) + 1">Press</button>
<label><input id="chk" type="checkbox"> Option</label>
<input id="txt" type="text" aria-label="Text" size="12"></p>
<div id="tall" tabindex="0" role="list" aria-label="rows"></div>
<script>
var list = document.getElementById('tall');
for (var i = 1; i <= 300; i++) {
  var row = document.createElement('div');
  row.setAttribute('role', 'listitem');
  row.textContent = 'Row ' + ('00' + i).slice(-3);
  list.appendChild(row);
}
for (var j = 1; j <= 300; j++) {
  var line = document.createElement('p');
  line.textContent = 'Line ' + ('00' + j).slice(-3);
  document.body.appendChild(line);
}
</script>
</body>
</html>
